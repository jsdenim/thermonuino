services:
  wasm-builder:
    image: emscripten/emsdk:latest
    working_dir: /src
    volumes:
      - .:/src
    command:
      - em++
      - src-core/greetings.cpp
      - -O2
      - --no-entry
      - -sWASM=1
      - -sMODULARIZE=1
      - -sEXPORT_NAME=createGreetingsModule
      - -sEXPORTED_FUNCTIONS=_buildGreetings,_setupThermostat,_resetThermostat,_evaluateThermostatSlot
      - -sEXPORTED_RUNTIME_METHODS=ccall,cwrap
      - -sALLOW_MEMORY_GROWTH=1
      - -o
      - simulator/wasm/greetings.js
